
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bài tập thực hành CSS</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        /* Group Selector */
        h1, h2 {
            text-align: center;
            color: #17365d;
        }

        /* Descendant Selector */
        .profile p {
            line-height: 1.8;
        }

        /* Class Selector */
        .hobbies label {
            font-size: 1.1rem;
            font-weight: 500;
        }

        /* Pseudo-class */
        .hobbies label:hover {
            background-color: #b3d9ff;
        }
    </style>
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>
        <h1 style="color: darkblue;">
            BÀI TẬP THỰC HÀNH CSS
        </h1>

        <p class="subtitle">
            Thông tin cá nhân - Bảng điểm - Form đăng ký
        </p>
    </header>

    <main>

        <!-- ================= BÀI 1 ================= -->

        <section class="profile">

            <h2>BÀI 1: THÔNG TIN CÁ NHÂN</h2>

            <!-- Ảnh đại diện -->
            <img
                id="avatar"
                src="3.jpg"
                alt="Ảnh đại diện"
            >

            <!-- Thông tin cá nhân -->
            <div class="profile-info">

                <label for="profile-name">
                    Họ và tên
                </label>

                <input
                    type="text"
                    id="profile-name"
                    name="profile-name"
                    placeholder="Nhập họ và tên"
                >

                <label for="profile-birth">
                    Năm sinh
                </label>

                <input
                    type="text"
                    id="profile-birth"
                    name="profile-birth"
                    placeholder="Nhập ngày/tháng/năm"
                >

            </div>

            <!-- Sở thích -->
            <h2>Sở thích</h2>

            <div class="hobbies">

                <label>
                    <input
                        type="checkbox"
                        name="hobby"
                        value="caulong"
                    >
                    Cầu lông
                </label>

                <label>
                    <input
                        type="checkbox"
                        name="hobby"
                        value="game"
                    >
                    Chơi Game
                </label>

            </div>

            <p>
                <a
                    href="https://www.phenikaa-uni.edu.vn/"
                    target="_blank"
            >
                Trường Đại học Phenikaa
                </a>
            </p>

        </section>


        <!-- ================= BÀI 2 ================= -->

        <section class="score-section">

            <h2>BÀI 2: BẢNG ĐIỂM SINH VIÊN</h2>

            <div class="table-container">

                <!-- Position Absolute -->
                <span class="table-label">
                    BẢNG ĐIỂM
                </span>

                <table>

                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>Tên học phần</th>
                            <th>Điểm</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr>
                            <td>1</td>

                            <td>
                                <input
                                    type="text"
                                    name="subject1"
                                    placeholder="Nhập tên học phần"
                                >
                            </td>

                            <td>
                                <input
                                    type="text"
                                    name="score1"
                                    placeholder="Điểm"
                                >
                            </td>
                        </tr>

                        <tr>
                            <td>2</td>

                            <td>
                                <input
                                    type="text"
                                    name="subject2"
                                    placeholder="Nhập tên học phần"
                                >
                            </td>

                            <td>
                                <input
                                    type="text"
                                    name="score2"
                                    placeholder="Điểm"
                                >
                            </td>
                        </tr>

                        <tr>
                            <td>3</td>

                            <td>
                                <input
                                    type="text"
                                    name="subject3"
                                    placeholder="Nhập tên học phần"
                                >
                            </td>

                            <td>
                                <input
                                    type="text"
                                    name="score3"
                                    placeholder="Điểm"
                                >
                            </td>
                        </tr>

                        <tr>
                            <td>4</td>

                            <td>
                                <input
                                    type="text"
                                    name="subject4"
                                    placeholder="Nhập tên học phần"
                                >
                            </td>

                            <td>
                                <input
                                    type="text"
                                    name="score4"
                                    placeholder="Điểm"
                                >
                            </td>
                        </tr>

                        <tr>
                            <td>5</td>

                            <td>
                                <input
                                    type="text"
                                    name="subject5"
                                    placeholder="Nhập tên học phần"
                                >
                            </td>

                            <td>
                                <input
                                    type="text"
                                    name="score5"
                                    placeholder="Điểm"
                                >
                            </td>
                        </tr>

                    </tbody>

                    <tfoot>

                        <tr>
                            <td colspan="2">
                                Điểm trung bình
                            </td>

                            <td>
                                <input
                                    type="text"
                                    name="average"
                                    placeholder="Điểm TB"
                                >
                            </td>
                        </tr>

                    </tfoot>

                </table>

            </div>

        </section>


        <!-- ================= BÀI 3 ================= -->

        <section class="register-section">

            <h2>BÀI 3: FORM ĐĂNG KÝ SINH VIÊN</h2>

            <div class="form-container">

                <!-- Position Absolute -->
                <span class="form-label">
                    ĐĂNG KÝ MỚI
                </span>

                <form action="#" method="post">

                    <!-- Họ tên và Email -->
                    <div class="form-row">

                        <div class="form-group">

                            <label for="fullname">
                                Họ và tên
                            </label>

                            <input
                                type="text"
                                id="fullname"
                                name="fullname"
                                placeholder="Nhập họ và tên"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Nhập email"
                                required
                            >

                        </div>

                    </div>


                    <!-- Ngày sinh -->
                    <div class="form-group">

                        <label for="birth">
                            Ngày sinh
                        </label>

                        <input
                            type="date"
                            id="birth"
                            name="birth"
                        >

                    </div>


                    <!-- Giới tính -->
                    <div class="form-group">

                        <label>Giới tính</label>

                        <div class="inline-options">

                            <label>
                                <input
                                    type="radio"
                                    name="gender"
                                    value="nam"
                                >
                                Nam
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="gender"
                                    value="nu"
                                >
                                Nữ
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="gender"
                                    value="khac"
                                >
                                Khác
                            </label>

                        </div>

                    </div>


                    <!-- Sở thích -->
                    <div class="form-group">

                        <label>Sở thích</label>

                        <div class="inline-options">

                            <label>
                                <input
                                    type="checkbox"
                                    name="hobby"
                                    value="caulong"
                                >
                                Cầu lông
                            </label>

                            <label>
                                <input
                                    type="checkbox"
                                    name="hobby"
                                    value="game"
                                >
                                Chơi Game
                            </label>

                            <label>
                                <input
                                    type="checkbox"
                                    name="hobby"
                                    value="music"
                                >
                                Âm nhạc
                            </label>

                        </div>

                    </div>


                    <!-- Ngành học -->
                    <div class="form-group">

                        <label for="major">
                            Ngành học
                        </label>

                        <select id="major" name="major">

                            <option value="">
                                Chọn ngành học
                            </option>

                            <option value="cntt">
                                Công nghệ thông tin
                            </option>

                            <option value="marketing">
                                Marketing
                            </option>

                            <option value="kinhte">
                                Kinh tế
                            </option>

                        </select>

                    </div>


                    <!-- Ghi chú -->
                    <div class="form-group">

                        <label for="message">
                            Ghi chú
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="4"
                            placeholder="Nhập ghi chú"
                        ></textarea>

                    </div>


                    <!-- Buttons -->
                    <div class="form-buttons">

                        <button type="submit">
                            Đăng ký
                        </button>

                        <button
                            type="reset"
                            class="reset-button"
                        >
                            Làm lại
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            Bài tập thực hành HTML và CSS
        </p>

    </footer>

</body>

</html>
