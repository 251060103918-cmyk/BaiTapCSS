
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thông tin cá nhân - Vũ Việt Nhật</title>

    <!-- Internal CSS -->
    <style>
        h1, h2 {
            text-align: center;
            color: #17365d;
        }

        h2 {
            font-size: 24px;
        }

        .profile {
            background-color: #f0f8ff;
            padding: 25px;
            border-radius: 15px;
            max-width: 500px;
            margin: 20px auto;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .profile p {
            font-size: 18px;
            line-height: 1.8;
            letter-spacing: 0.5px;
        }

        #avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 20px auto;
            border: 4px solid #3498db;
        }

        ul {
            list-style-type: square;
            padding-left: 30px;
        }

        li {
            padding: 10px;
            margin: 8px 0;
            background-color: #ffffff;
            border-radius: 8px;
            transition: 0.3s;
        }

        li:hover {
            background-color: #b3d9ff;
        }

        a {
            text-decoration: none;
            color: #0066cc;
        }

        a:hover {
            color: red;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1 style="color: darkblue;">
            Thông tin cá nhân
        </h1>
    </header>

    <main>

        <section class="profile">

            <h2>Hồ sơ cá nhân</h2>

            <img
                id="avatar"
                src="images/3.jpg"
                alt="Ảnh đại diện của Vũ Việt Nhật"
            >

            <p><strong>Họ tên:</strong> Vũ Việt Nhật</p>

            <p><strong>Năm sinh:</strong> 07/02/2007</p>

            <p><strong>Sở thích:</strong></p>

            <ul>
                <li>Cầu lông</li>
                <li>Chơi Game</li>
            </ul>

            <p>
                <a href="https://github.com">
                    GitHub
                </a>
            </p>

        </section>

    </main>

    <footer>
        <p>© 2026 - Vũ Việt Nhật</p>
    </footer>

</body>
</html>
